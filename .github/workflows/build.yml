name: Build

# Every push to main: unit tests, signed APK, on-device checks with screenshots.
# Pushing a version tag (for example v1.0) also publishes the APK on the Releases page.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Tests and signed APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests and compile check
        run: bash .github/scripts/gradle.sh testReleaseUnitTest assembleDebug

      - name: Unpack the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.AWE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::The AWE_KEYSTORE_BASE64 secret is missing, so the APK can't be signed."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/awe-release.jks"
          echo "AWE_KEYSTORE_PATH=$RUNNER_TEMP/awe-release.jks" >> "$GITHUB_ENV"

      - name: Signed APK
        env:
          AWE_KEYSTORE_PASSWORD: ${{ secrets.AWE_KEYSTORE_PASSWORD }}
          AWE_KEY_ALIAS: ${{ secrets.AWE_KEY_ALIAS }}
          AWE_KEY_PASSWORD: ${{ secrets.AWE_KEY_PASSWORD }}
        run: bash .github/scripts/gradle.sh assembleRelease

      - name: Name the APK
        run: |
          version=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          cp app/build/outputs/apk/release/app-release.apk "AWE-v$version.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: AWE-v*.apk

  device-check:
    name: On-device checks and screenshots
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/download-artifact@v4
        with:
          name: apk

      - name: Allow the emulator to use hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run checks on an Android 14 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash .github/scripts/device-check.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: screens/

      - name: Keep screenshots on the ci-screens branch for review
        if: always()
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [ -d screens ] || exit 0
          cd screens
          git init -q -b ci-screens
          git add -A
          git -c user.name="AWE build" -c user.email="actions@users.noreply.github.com" commit -qm "Screenshots for ${GITHUB_SHA::7}"
          git push -fq "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}" ci-screens

  release:
    name: Publish the APK
    needs: [build, device-check]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: apk

      - uses: softprops/action-gh-release@v2
        with:
          name: AWE ${{ github.ref_name }} · Awesome Weather for Android
          files: AWE-v*.apk
          body: |
            **To install on your phone:** open this page in Chrome on your phone, tap the `.apk` file below, then tap **Open** and **Install**.
            The first time, Android asks you to allow Chrome to install apps; allow it once.
