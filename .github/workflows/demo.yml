name: Demo videos
# Run by hand (Actions → Demo videos → Run workflow): records the widget and Clock clips for the Play Store video
# on an emulator, using the APK from the newest release, and keeps them on the demo-videos branch.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  record:
    name: Record the demo clips
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - name: Download the newest release APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download --repo "$GITHUB_REPOSITORY" --pattern 'AWE-v*.apk'

      - name: Allow the emulator to use hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Record on an Android 14 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disable-animations: false
          script: bash .github/scripts/demo.sh

      - name: Keep the clips on the demo-videos branch
        if: always()
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [ -d demo ] || exit 0
          cd demo
          git init -q -b demo-videos
          git add -A
          git -c user.name="AWE build" -c user.email="actions@users.noreply.github.com" commit -qm "Demo clips for ${GITHUB_SHA::7}"
          git push -fq "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}" demo-videos
