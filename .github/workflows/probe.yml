name: Probe Open-Meteo
on:
  push:
    branches: [probe-openmeteo]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: |
          mkdir -p data
          L="latitude=44.9429&longitude=-123.0351"
          curl -sf "https://archive-api.open-meteo.com/v1/archive?$L&start_date=1996-01-01&end_date=2025-12-31&daily=temperature_2m_max,temperature_2m_min&temperature_unit=fahrenheit&timezone=auto" -o data/archive.json
          curl -sf "https://archive-api.open-meteo.com/v1/archive?$L&start_date=2026-07-01&end_date=2026-08-15&daily=temperature_2m_max,temperature_2m_min&temperature_unit=fahrenheit&timezone=auto" -o data/july2026.json
          curl -sf "https://api.open-meteo.com/v1/forecast?$L&daily=temperature_2m_max,temperature_2m_min&temperature_unit=fahrenheit&timezone=auto&forecast_days=16" -o data/forecast.json
          ls -la data
          git config user.name "AWE build"; git config user.email "actions@users.noreply.github.com"
          git add data && git commit -qm "Salem data" && git push -q
