name: Probe Open-Meteo
on:
  push:
    branches: [probe-openmeteo]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: |
          mkdir -p data
          L="latitude=44.9429&longitude=-123.0351"
          get() { for t in 1 2 3; do code=$(curl -s -o "$2" -w "%{http_code}" "$1"); [ "$code" = 200 ] && return 0; echo "::warning title=$2::HTTP $code $(head -c 200 "$2")"; sleep 20; done; }
          for r in 1996:2005 2006:2015 2016:2025; do a=${r%:*}; b=${r#*:}
            get "https://archive-api.open-meteo.com/v1/archive?$L&start_date=$a-01-01&end_date=$b-12-31&daily=temperature_2m_max,temperature_2m_min&temperature_unit=fahrenheit&timezone=auto" data/archive-$a.json; sleep 5; done
          get "https://archive-api.open-meteo.com/v1/archive?$L&start_date=2026-07-01&end_date=2026-08-15&daily=temperature_2m_max,temperature_2m_min&temperature_unit=fahrenheit&timezone=auto" data/july2026.json
          get "https://api.open-meteo.com/v1/forecast?$L&daily=temperature_2m_max,temperature_2m_min&temperature_unit=fahrenheit&timezone=auto&forecast_days=16" data/forecast.json
          ls -la data
          git config user.name "AWE build"; git config user.email "actions@users.noreply.github.com"
          git add data && git commit -qm "Salem data" && git push -q
