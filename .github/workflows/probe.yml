name: Probe Open-Meteo
on:
  push:
    branches: [probe-openmeteo]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: |
          mkdir -p data
          L="latitude=44.9429&longitude=-123.0351"
          y=$(date +%Y)
          code=$(curl -s -o /tmp/a.json -w "%{http_code} %{time_total}s %{size_download}B" "https://archive-api.open-meteo.com/v1/archive?$L&start_date=$((y-30))-01-01&end_date=$((y-1))-12-31&daily=temperature_2m_max,temperature_2m_min,precipitation_sum,snowfall_sum&temperature_unit=fahrenheit&precipitation_unit=inch&timezone=auto")
          echo "::warning title=app-30yr::$code $(head -c 300 /tmp/a.json)"
          ls -la data
          git config user.name "AWE build"; git config user.email "actions@users.noreply.github.com"
